<div style="text-align: center; margin-top: 30px; padding: 24px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
  <h2 style="color: #58247F; margin-bottom: 10px;">Acesso ao Sistema</h2>

  @if (currentUser(); as user) {
    <p style="color: #333; margin-bottom: 24px;">
      Bem-vindo(a), <strong style="color: #58247F;">{{ user.nomeCompleto }}</strong> ({{ user.tipoPessoaNome }})
    </p>
  } @else {
    <p style="color: #666; margin-bottom: 24px;">Faça login ou selecione seu painel para continuar</p>
  }

  <div style="display: flex; flex-direction: column; gap: 15px;">
    @if (!currentUser()) {
      <button routerLink="/login" style="padding: 18px; font-size: 18px; font-weight: bold; cursor: pointer; background-color: #58247F; color: #FFFFFF; border: none; border-radius: 8px; box-shadow: 0 2px 4px rgba(88, 36, 127, 0.3);">
        Fazer Login
      </button>
    }
    <button routerLink="/portaria" style="padding: 18px; font-size: 18px; font-weight: bold; cursor: pointer; background-color: #DF184F; color: #FFFFFF; border: none; border-radius: 8px; box-shadow: 0 2px 4px rgba(223, 24, 79, 0.3);">
      Painel da Portaria (Porteiro)
    </button>
    <button routerLink="/sala" style="padding: 18px; font-size: 18px; font-weight: bold; cursor: pointer; background-color: #F46E22; color: #FFFFFF; border: none; border-radius: 8px; box-shadow: 0 2px 4px rgba(244, 110, 34, 0.3);">
      Painel da Sala de Aula (Professor)
    </button>
    <button routerLink="/gestao" style="padding: 18px; font-size: 18px; font-weight: bold; cursor: pointer; background-color: #58247F; color: #FFFFFF; border: none; border-radius: 8px; box-shadow: 0 2px 4px rgba(88, 36, 127, 0.3);">
      Cadastrar / Editar Alunos e Turmas
    </button>
  </div>
</div>
