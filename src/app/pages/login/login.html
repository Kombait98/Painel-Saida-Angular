<div style="margin-top: 20px; padding: 24px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 4px 12px rgba(88, 36, 127, 0.1);">
  <div style="text-align: center; margin-bottom: 24px;">
    <div style="width: 56px; height: 56px; border-radius: 50%; background: #58247F; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin-bottom: 10px;">
      🏫
    </div>
    <h2 style="color: #58247F; margin: 0 0 6px 0;">Controle de Saída Escolar</h2>
    <p style="color: #666; font-size: 14px; margin: 0;">Entre com suas credenciais para acessar o painel</p>
  </div>

  @if (errorMessage()) {
    <div style="background: #fde8e8; border-left: 4px solid #E32427; color: #E32427; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; margin-bottom: 16px;">
      {{ errorMessage() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 15px;">
    <div>
      <label style="display: block; font-size: 13px; font-weight: bold; color: #58247F; margin-bottom: 6px;">Usuário (UserId)</label>
      <input
        type="text"
        name="userId"
        [(ngModel)]="userId"
        placeholder="Ex: porteiro ou prof.a"
        style="width: 100%; padding: 14px; font-size: 16px; border: 1.5px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none;"
      />
    </div>

    <div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <label style="font-size: 13px; font-weight: bold; color: #58247F;">Senha</label>
        <a routerLink="/reset-senha" style="font-size: 12px; color: #F46E22; font-weight: bold; text-decoration: none;">
          Esqueceu a senha?
        </a>
      </div>
      <input
        type="password"
        name="senha"
        [(ngModel)]="senha"
        placeholder="Digite sua senha"
        style="width: 100%; padding: 14px; font-size: 16px; border: 1.5px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none;"
      />
    </div>

    <button
      type="submit"
      [disabled]="loading()"
      style="padding: 16px; font-size: 16px; font-weight: bold; cursor: pointer; background: linear-gradient(90deg, #58247F, #DF184F); color: #FFFFFF; border: none; border-radius: 8px; margin-top: 5px; box-shadow: 0 3px 8px rgba(223, 24, 79, 0.25);">
      {{ loading() ? 'Autenticando...' : 'Entrar no Painel' }}
    </button>
  </form>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid #f0f0f0;">
    <a routerLink="/cadastro-usuario" style="color: #58247F; font-size: 13px; font-weight: bold; text-decoration: none;">
      + Cadastrar novo usuário
    </a>
    <a routerLink="/reset-senha" style="color: #DF184F; font-size: 13px; font-weight: bold; text-decoration: none;">
      Redefinir senha
    </a>
  </div>

  <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid #eee;">
    <p style="font-size: 12px; color: #888; text-align: center; margin: 0 0 12px 0; font-weight: bold; text-transform: uppercase;">
      Acesso Rápido (Usuários do Banco PostgreSQL - Senha: 123)
    </p>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      @for (u of quickUsers; track u.userId) {
        <button
          type="button"
          (click)="fillAndLogin(u)"
          [style.border-color]="u.color"
          [style.color]="u.color"
          style="padding: 10px; font-size: 13px; font-weight: bold; background: #fdfdfd; border: 1.5px solid; border-radius: 8px; cursor: pointer;">
          {{ u.label }} ({{ u.userId }})
        </button>
      }
    </div>
  </div>
</div>
